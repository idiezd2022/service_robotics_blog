<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>P2 — Coming Soon</title>


    <style>

        /* =========================
           GENERAL
           ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #111827;
            line-height: 1.7;
        }


        /* =========================
           NAVBAR
           ========================= */

        .navbar {
            height: 65px;
            background: #111827;
        
            display: flex;
            align-items: center;
            justify-content: space-between;
        
            padding: 0 40px;
        
            /*position: sticky;
            top: 15px;
            z-index: 1000;*/
        
            border-radius: 50px;
        
            margin: 25px 20px 0;
        
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }


        .logo {
            color: white;

            text-decoration: none;

            font-size: 1.05rem;

            font-weight: bold;
        }


        .nav-links {
            display: flex;

            gap: 25px;
        }


        .nav-links a {
            color: #9ca3af;

            text-decoration: none;

            transition: 0.2s;
        }


        .nav-links a:hover {
            color: white;
        }


        .nav-links a.active {
            color: #60a5fa;

            font-weight: bold;
        }


        /* =========================
           PROJECT HEADER
           ========================= */

        .project-header {
            background: white;

            text-align: center;

            padding: 45px 20px 70px;

            border-bottom: 1px solid #e5e7eb;
        }


        .project-number {
            display: block;

            color: #2563eb;

            font-size: 0.85rem;

            font-weight: bold;

            letter-spacing: 3px;

            margin-bottom: 15px;
        }


        .project-header h1 {
            font-size: 3rem;

            margin-bottom: 10px;
        }


        .project-header p {
            color: #6b7280;

            font-size: 1.15rem;
        }


        /* =========================
           MAIN CONTENT
           ========================= */

        .content {
            max-width: 950px;

            margin: 0 auto;

            padding: 60px 20px 80px;
        }


        .section {
            background: white;

            padding: 35px;

            margin-bottom: 30px;

            border-radius: 12px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.04);
        }


        .section h2 {
            color: #2563eb;

            font-size: 1.5rem;

            margin-bottom: 20px;
        }


        .section p {
            color: #4b5563;

            margin-bottom: 15px;
            text-align: justify;
        }


        /* =========================
           INFORMATION CARDS
           ========================= */

        .info-grid {
            /*display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;

            margin-top: 30px;*/

            display: flex;

            flex-direction: column;
    
            gap: 18px;
    
            margin-top: 30px;
        }


        .info-card {
            /*padding: 25px;

            background: #f8fafc;

            border-radius: 10px;

            border-left: 4px solid #2563eb;*/

            display: flex;

            align-items: flex-start;
    
            gap: 25px;
    
            padding: 25px 30px;
    
            background: #f8fafc;
    
            border-radius: 12px;
    
            border-left: 4px solid #2563eb;
    
            transition: 0.2s ease;
        }


        /*.info-card span {
            color: #2563eb;

            font-size: 0.8rem;

            font-weight: bold;
        }


        .info-card h3 {
            margin: 8px 0;

            font-size: 1.2rem;
        }


        .info-card p {
            font-size: 0.95rem;

            margin: 0;
        }*/

        .info-card:hover {
                transform: translateX(6px);
        
                background: #eff6ff;
        
                box-shadow:
                    0 8px 20px rgba(0, 0, 0, 0.08);
            }
        
        
         .info-card > span {
                color: #2563eb;
        
                font-size: 1rem;
        
                font-weight: bold;
        
                min-width: 35px;
        
                padding-top: 3px;
            }
        
        
            .info-card-content {
                flex: 1;
            }
        
        
            .info-card h3 {
                margin: 0 0 10px;
        
                font-size: 1.2rem;
        
                color: #111827;
            }
        
        
            .info-card p {
                font-size: 0.95rem;
        
                margin: 0;
        
                color: #4b5563;
            }


        /* =========================
           PROJECT IMAGES
           ========================= */

        .project-image {
            width: 100%;

            height: auto;

            margin-top: 25px;

            border-radius: 12px;

            border: 2px solid #e5e7eb;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }


        /* =========================
           BACK BUTTON
           ========================= */

        .back {
            text-align: center;

            margin-top: 40px;
        }


        .back a {
            display: inline-block;

            padding: 12px 20px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            transition: 0.2s;
        }


        .back a:hover {
            background: #1d4ed8;
        }


        /* =========================
           FOOTER
           ========================= */

        footer {
            /*background: #111827;

            color: #9ca3af;

            text-align: center;

            padding: 30px;*/

            background: #111827;
            color: #9ca3af;
        
            text-align: center;
        
            padding: 25px 30px;
        
            margin: 0 25px 20px;
        
            border-radius: 50px;
        
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a {
                font-size: 0.9rem;
            }

            .project-header {
                padding: 60px 20px;
            }

            .project-header h1 {
                font-size: 2.2rem;
            }

            .section {
                padding: 25px;
            }

        }

    </style>

</head>
